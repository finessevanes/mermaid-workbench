name: Bug report
description: Report reproducible behavior that is not working as expected.
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a problem. Do not include credentials, database files, backups, or private diagram content.
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the problem and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      description: Provide the smallest reliable sequence that reproduces the problem.
      placeholder: |
        1. Start Mermaid Workbench
        2. Open a diagram
        3. ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Commit or version
      description: Provide the commit SHA or version if known.
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Operating system, browser, and Node.js version.
    validations:
      required: true
  - type: textarea
    id: additional
    attributes:
      label: Additional context
      description: Add sanitized logs or screenshots when helpful.
