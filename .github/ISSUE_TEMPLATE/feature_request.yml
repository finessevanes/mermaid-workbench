name: Feature request
description: Propose a focused improvement to Mermaid Workbench.
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What user problem would this solve?
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Desired outcome
      description: Describe what success looks like without prescribing implementation.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Describe current workarounds or other approaches.
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Add examples, references, or sanitized screenshots when useful.
